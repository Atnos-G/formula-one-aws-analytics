version: 2

sources:
  - name: formula_one_raw
    database: AwsDataCatalog
    schema: formula_one_raw
    description: "Raw JSON ingéré depuis l'API Ergast (payload JSON + partitions season/load_date)."

    tables:
      - name: raw_races_json
        description: "Races JSON (MRData.RaceTable.Races)"
        columns:
          - name: season
            tests: [not_null]
          - name: load_date
            tests: [not_null]

      - name: raw_drivers_json
        description: "Drivers JSON (MRData.DriverTable.Drivers)"
        columns:
          - name: season
            tests: [not_null]
          - name: load_date
            tests: [not_null]

      - name: raw_constructors_json
        description: "Constructors JSON (MRData.ConstructorTable.Constructors)"
        columns:
          - name: season
            tests: [not_null]
          - name: load_date
            tests: [not_null]

      - name: raw_results_json
        description: "Results JSON (MRData.RaceTable.Races[].Results[])"
        columns:
          - name: season
            tests: [not_null]
          - name: load_date
            tests: [not_null]
